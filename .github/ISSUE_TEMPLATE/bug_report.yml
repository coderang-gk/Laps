name: Bug Report
description: Report a broken widget, sync issue, or unexpected behavior
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Component Area
      description: Where did the problem occur?
      options:
        - "Home Screen Widget (Rendering or Resize)"
        - "Widget Background Refresh / Stale Data"
        - "COROS Account Connection / Auth"
        - "Google Calendar Sync (Insert / Shift / Skip)"
        - "80/20 Plan Generator"
        - "Training Hub App UI"
        - "Other"
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device & OS
      description: e.g. Google Pixel 8 (Android 14), Samsung Galaxy S23 (OneUI 6), OnePlus 11 (OxygenOS 14)
      placeholder: "e.g., Pixel 7 Pro, Android 14"
    validations:
      required: true

  - type: input
    id: watch_model
    attributes:
      label: COROS Watch Model (Optional)
      description: e.g. PACE 2, PACE 3, APEX 2 Pro, VERTIX 2
      placeholder: "e.g., PACE 3"
    validations:
      required: false

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Open Settings
        2. Enter COROS credentials
        3. Add Next Workout widget to home screen
        4. See that ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Screenshots
      description: Attach screenshots or relevant details. Please NEVER include passwords or private personal information!
    validations:
      required: false
